apiVersion: v1
# We are creating a pod 
kind: Pod
metadata:
  name: two-tier-app-pod
# specifications of pod 
# Add the enviroment variables 
spec:
  containers:
  - name: two-tier-app-pod
    image: sumany15/flaskapp:latest
    env:
      - name: MYSQL_HOST
        value: "10.97.50.99"          # this is mysql's service clusture IP
      - name: MYSQL_PASSWORD
        value: "admin"
      - name: MYSQL_USER
        value: "admin"
      - name: MYSQL_DB
        value: "mydb"
    ports:
      - containerPort: 5000
    imagePullPolicy: Always
    
